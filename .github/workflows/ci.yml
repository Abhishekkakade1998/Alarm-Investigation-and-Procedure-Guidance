name: CI

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            apps/backend/requirements.txt
            apps/frontend/requirements.txt
            mcp-servers/alarm-management/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r apps/backend/requirements.txt -r apps/frontend/requirements.txt

      - name: Compile Python sources
        run: python -m compileall -q apps mcp-servers rag tests

      - name: Run unit, integration, and MCP tests with coverage
        run: |
          python -m pytest tests/unit tests/integration tests/mcp \
            --cov=. --cov-report=term --cov-report=xml

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-coverage
          path: coverage.xml
          if-no-files-found: warn
